<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark luxurious background -->
  <rect width="1920" height="1080" fill="#2C2C2C"/>

  <!-- Marble texture simulation -->
  <defs>
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2C2C2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A3A3A;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="spotlight" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0" />
    </radialGradient>

    <filter id="luxury-glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blurred cityscape background -->
  <g opacity="0.2">
    <rect x="100" y="200" width="80" height="400" fill="#4A4A4A"/>
    <rect x="250" y="150" width="100" height="450" fill="#3A3A3A"/>
    <rect x="450" y="250" width="70" height="350" fill="#4A4A4A"/>
    <rect x="1500" y="180" width="90" height="420" fill="#3A3A3A"/>
    <rect x="1650" y="220" width="120" height="380" fill="#4A4A4A"/>
  </g>

  <!-- Marble surface with veins -->
  <ellipse cx="960" cy="900" rx="800" ry="150" fill="url(#marble)" opacity="0.8"/>
  <path d="M 200 850 Q 500 870, 800 860 T 1400 850 T 1700 870" stroke="#1A1A1A" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 300 880 Q 600 900, 900 890 T 1500 880" stroke="#3A3A3A" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Dramatic spotlight on product -->
  <ellipse cx="750" cy="540" rx="300" ry="400" fill="url(#spotlight)"/>

  <!-- Luxury product bottle (center-left) -->
  <g transform="translate(600, 250)">
    <!-- Bottle shadow -->
    <ellipse cx="150" cy="550" rx="100" ry="25" fill="#000000" opacity="0.4"/>

    <!-- Main bottle with gradient -->
    <defs>
      <linearGradient id="bottle-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#3A3A3A;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#2C2C2C;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
      </linearGradient>
    </defs>

    <rect x="50" y="150" width="200" height="380" rx="15" fill="url(#bottle-gradient)"/>
    <rect x="90" y="100" width="120" height="60" rx="10" fill="#1A1A1A"/>

    <!-- Dramatic side lighting highlight -->
    <rect x="220" y="200" width="25" height="300" rx="12" fill="#D4AF37" opacity="0.6" filter="url(#luxury-glow)"/>
    <ellipse cx="235" cy="250" rx="15" ry="60" fill="white" opacity="0.4"/>

    <!-- Gold label -->
    <rect x="70" y="300" width="160" height="140" rx="8" fill="#D4AF37" opacity="0.2"/>
    <rect x="80" y="310" width="140" height="2" fill="#D4AF37" opacity="0.8"/>
    <text x="150" y="360" font-family="Georgia, serif" font-size="32" font-weight="300" fill="#D4AF37" text-anchor="middle">Na</text>
    <text x="150" y="390" font-family="Georgia, serif" font-size="14" fill="#E8D5C4" text-anchor="middle">奈十八本</text>
    <rect x="80" y="420" width="140" height="2" fill="#D4AF37" opacity="0.8"/>
  </g>

  <!-- Aromatic visual elements - floating golden particles -->
  <g filter="url(#luxury-glow)">
    <path d="M 1000 400 Q 1050 350, 1100 380 Q 1150 410, 1180 360" stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 950 500 Q 1000 480, 1050 510 Q 1100 540, 1130 500" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="1050" cy="420" r="4" fill="#D4AF37" opacity="0.6">
      <animate attributeName="cy" values="420;380;420" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="490" r="3" fill="#D4AF37" opacity="0.5">
      <animate attributeName="cy" values="490;460;490" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Luxury props silhouettes -->
  <g opacity="0.3">
    <!-- Candle -->
    <rect x="1100" y="750" width="60" height="100" rx="30" fill="#E8D5C4"/>
    <ellipse cx="1130" cy="750" rx="30" ry="8" fill="#D4AF37"/>

    <!-- Dried flowers -->
    <circle cx="400" cy="780" r="15" fill="#E8D5C4"/>
    <circle cx="420" cy="770" r="12" fill="#E8D5C4"/>
    <line x1="410" y1="795" x2="410" y2="850" stroke="#8B7355" stroke-width="2"/>

    <!-- Silk fabric wave -->
    <path d="M 1300 850 Q 1400 820, 1500 850 T 1700 850" fill="#E8D5C4" opacity="0.4"/>
  </g>

  <!-- Brand positioning text -->
  <text x="1300" y="500" font-family="Georgia, serif" font-size="36" font-style="italic" fill="#D4AF37" opacity="0.8">嗅觉艺术品</text>
  <text x="1300" y="540" font-family="Arial, sans-serif" font-size="18" fill="#E8D5C4" opacity="0.6">18种香调 · 奢华体验</text>
</svg>
