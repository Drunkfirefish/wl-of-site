<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Natural light background -->
  <defs>
    <linearGradient id="natural-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E68C;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8FBC8F;stop-opacity:0.2" />
    </linearGradient>

    <filter id="natural-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>

    <filter id="droplet">
      <feGaussianBlur stdDeviation="1"/>
      <feSpecularLighting surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#ffffff">
        <fePointLight x="-5000" y="-5000" z="10000"/>
      </feSpecularLighting>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#natural-bg)"/>
  <rect width="1920" height="1080" fill="#FAFAEB"/>

  <!-- Blurred forest/field background -->
  <g filter="url(#natural-blur)" opacity="0.4">
    <ellipse cx="300" cy="400" rx="150" ry="300" fill="#6B8E23"/>
    <ellipse cx="500" cy="350" rx="120" ry="280" fill="#8FBC8F"/>
    <ellipse cx="700" cy="420" rx="180" ry="320" fill="#6B8E23"/>
    <ellipse cx="1400" cy="380" rx="200" ry="350" fill="#8FBC8F"/>
    <ellipse cx="1650" cy="420" rx="160" ry="300" fill="#6B8E23"/>
  </g>

  <!-- Wooden display platform (using golden ratio positioning) -->
  <g transform="translate(590, 450)">
    <!-- Wood texture simulation -->
    <defs>
      <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#A0826D;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- Platform surface -->
    <ellipse cx="200" cy="150" rx="350" ry="80" fill="url(#wood)" opacity="0.7"/>
    <rect x="-150" y="100" width="700" height="50" fill="url(#wood)" opacity="0.6"/>

    <!-- Wood grain lines -->
    <path d="M -100 120 Q 200 115, 500 125" stroke="#654321" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M -80 135 Q 250 130, 520 140" stroke="#654321" stroke-width="0.8" fill="none" opacity="0.25"/>

    <!-- Product bottle -->
    <g transform="translate(200, -180)">
      <ellipse cx="0" cy="250" rx="70" ry="20" fill="#6B8E23" opacity="0.2"/>

      <!-- Frosted bottle with green liquid inside -->
      <rect x="-55" y="50" width="110" height="200" rx="12" fill="#8FBC8F" opacity="0.4" stroke="#6B8E23" stroke-width="2"/>
      <rect x="-45" y="70" width="90" height="160" rx="8" fill="#6B8E23" opacity="0.6"/>

      <!-- Cap -->
      <rect x="-40" y="25" width="80" height="30" rx="8" fill="#6B8E23" opacity="0.8"/>

      <!-- Frosted glass effect -->
      <rect x="-50" y="55" width="100" height="190" rx="12" fill="white" opacity="0.15"/>

      <!-- Natural light reflection -->
      <ellipse cx="-20" cy="120" rx="15" ry="50" fill="white" opacity="0.3"/>

      <!-- Label with botanical elements -->
      <rect x="-45" y="130" width="90" height="80" rx="6" fill="#F0E68C" opacity="0.7"/>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6B8E23" text-anchor="middle">菁华</text>
      <text x="0" y="185" font-family="Arial, sans-serif" font-size="12" fill="#6B8E23" text-anchor="middle">Jinghua</text>

      <!-- Leaf icon on label -->
      <path d="M -5 195 Q 0 200, 5 195 Q 0 200, -5 195" fill="#6B8E23" opacity="0.6"/>
    </g>
  </g>

  <!-- Natural elements around product -->
  <!-- Mint leaves (left) -->
  <g transform="translate(300, 550)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="25" ry="40" fill="#6B8E23" transform="rotate(-30)"/>
    <ellipse cx="30" cy="-10" rx="20" ry="35" fill="#8FBC8F" transform="rotate(-15)"/>
    <ellipse cx="15" cy="25" rx="22" ry="38" fill="#6B8E23" transform="rotate(-45)"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#556B2F" stroke-width="2"/>
  </g>

  <!-- Eucalyptus branches (right) -->
  <g transform="translate(1100, 480)" opacity="0.7">
    <line x1="0" y1="0" x2="80" y2="120" stroke="#6B8E23" stroke-width="3"/>
    <ellipse cx="20" cy="30" rx="15" ry="25" fill="#8FBC8F" transform="rotate(45)"/>
    <ellipse cx="40" cy="60" rx="12" ry="22" fill="#8FBC8F" transform="rotate(30)"/>
    <ellipse cx="60" cy="90" rx="14" ry="24" fill="#8FBC8F" transform="rotate(50)"/>
  </g>

  <!-- Cotton bolls (bottom left) -->
  <g transform="translate(450, 750)" opacity="0.75">
    <circle cx="0" cy="0" r="30" fill="#FFFACD"/>
    <circle cx="-8" cy="-8" r="12" fill="#FFFFFF"/>
    <circle cx="8" cy="-8" r="12" fill="#FFFFFF"/>
    <circle cx="-8" cy="8" r="12" fill="#FFFFFF"/>
    <circle cx="8" cy="8" r="12" fill="#FFFFFF"/>
    <line x1="0" y1="30" x2="0" y2="60" stroke="#8B7355" stroke-width="2"/>
  </g>

  <!-- Woven basket (bottom right) -->
  <g transform="translate(1050, 720)" opacity="0.6">
    <ellipse cx="0" cy="50" rx="80" ry="30" fill="#D2B48C"/>
    <path d="M -80 50 L -70 0 L 70 0 L 80 50" fill="#DEB887" stroke="#8B7355" stroke-width="2"/>
    <path d="M -60 10 L -55 45" stroke="#8B7355" stroke-width="1.5" opacity="0.5"/>
    <path d="M -30 10 L -27 45" stroke="#8B7355" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 10 L 0 45" stroke="#8B7355" stroke-width="1.5" opacity="0.5"/>
    <path d="M 30 10 L 27 45" stroke="#8B7355" stroke-width="1.5" opacity="0.5"/>
    <path d="M 60 10 L 55 45" stroke="#8B7355" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Water droplets and dew effects -->
  <g filter="url(#droplet)">
    <circle cx="750" cy="420" r="6" fill="#E0FFFF" opacity="0.8" stroke="#6B8E23" stroke-width="0.5"/>
    <circle cx="820" cy="480" r="8" fill="#E0FFFF" opacity="0.75" stroke="#6B8E23" stroke-width="0.5"/>
    <circle cx="680" cy="550" r="5" fill="#E0FFFF" opacity="0.8" stroke="#6B8E23" stroke-width="0.5"/>
    <circle cx="900" cy="510" r="7" fill="#E0FFFF" opacity="0.7" stroke="#6B8E23" stroke-width="0.5"/>
  </g>

  <!-- Linen fabric texture (bottom) -->
  <g transform="translate(1200, 820)" opacity="0.4">
    <rect x="0" y="0" width="300" height="100" fill="#FAF0E6" rx="5"/>
    <path d="M 0 20 L 300 20" stroke="#D2B48C" stroke-width="0.5" opacity="0.3"/>
    <path d="M 0 40 L 300 40" stroke="#D2B48C" stroke-width="0.5" opacity="0.3"/>
    <path d="M 0 60 L 300 60" stroke="#D2B48C" stroke-width="0.5" opacity="0.3"/>
    <path d="M 0 80 L 300 80" stroke="#D2B48C" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- FSC certification badge -->
  <g transform="translate(1700, 850)" opacity="0.6">
    <circle cx="0" cy="0" r="35" fill="#6B8E23" opacity="0.2" stroke="#6B8E23" stroke-width="2"/>
    <path d="M -10 -5 L -10 10 M -5 -8 L -5 10 M 0 -10 L 0 10" stroke="#6B8E23" stroke-width="2"/>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="8" fill="#6B8E23" text-anchor="middle">FSC</text>
  </g>

  <!-- Brand message with ample white space -->
  <text x="1400" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="300" fill="#6B8E23" opacity="0.85">回归自然本质</text>
  <text x="1400" y="350" font-family="Arial, sans-serif" font-size="22" fill="#8FBC8F" opacity="0.75">90%植物成分 · 生态洗护</text>
</svg>
