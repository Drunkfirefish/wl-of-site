<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft gradient background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DDA0DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>

  <!-- Soft clouds -->
  <g opacity="0.4" fill="#FFFFFF">
    <ellipse cx="300" cy="200" rx="120" ry="60"/>
    <ellipse cx="380" cy="220" rx="100" ry="50"/>
    <ellipse cx="250" cy="230" rx="90" ry="45"/>

    <ellipse cx="1600" cy="250" rx="140" ry="70"/>
    <ellipse cx="1680" cy="270" rx="110" ry="55"/>

    <ellipse cx="800" cy="150" rx="100" ry="50"/>
    <ellipse cx="1200" cy="180" rx="130" ry="65"/>
  </g>

  <!-- Cloud-shaped display platform (center) -->
  <g transform="translate(960, 540)">
    <!-- Main cloud platform -->
    <ellipse cx="0" cy="50" rx="400" ry="100" fill="#FFF8DC" opacity="0.9"/>
    <ellipse cx="-150" cy="30" rx="200" ry="80" fill="#FFF8DC" opacity="0.9"/>
    <ellipse cx="150" cy="30" rx="200" ry="80" fill="#FFF8DC" opacity="0.9"/>
    <ellipse cx="-100" cy="-20" rx="180" ry="70" fill="#FFF8DC" opacity="0.9"/>
    <ellipse cx="100" cy="-20" rx="180" ry="70" fill="#FFF8DC" opacity="0.9"/>
    <ellipse cx="0" cy="-40" rx="150" ry="60" fill="#FFF8DC" opacity="0.9"/>

    <!-- Product bottle centered -->
    <g transform="translate(0, -150)">
      <ellipse cx="0" cy="200" rx="60" ry="15" fill="#FFB6C1" opacity="0.3"/>
      <rect x="-50" y="50" width="100" height="150" rx="15" fill="#FFB6C1" opacity="0.85"/>
      <rect x="-35" y="30" width="70" height="25" rx="8" fill="#FFB6C1" opacity="0.9"/>
      <ellipse cx="0" cy="100" rx="20" ry="40" fill="white" opacity="0.4"/>

      <!-- Label -->
      <rect x="-40" y="100" width="80" height="50" rx="5" fill="white" opacity="0.7"/>
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFB6C1" text-anchor="middle">Lamama</text>
    </g>

    <!-- Baby items around product -->
    <!-- Baby clothes -->
    <g transform="translate(-200, -80)">
      <rect x="-30" y="0" width="60" height="70" rx="8" fill="#87CEEB" opacity="0.7"/>
      <circle cx="0" cy="20" r="15" fill="white" opacity="0.5"/>
    </g>

    <!-- Towel -->
    <g transform="translate(180, -60)">
      <rect x="-25" y="0" width="50" height="60" rx="5" fill="#FFE4E1" opacity="0.7"/>
      <rect x="-20" y="10" width="40" height="3" fill="white" opacity="0.6"/>
      <rect x="-20" y="20" width="40" height="3" fill="white" opacity="0.6"/>
    </g>

    <!-- Toy blocks -->
    <g transform="translate(-250, 20)">
      <rect x="0" y="0" width="40" height="40" rx="5" fill="#FFB6C1" opacity="0.6"/>
      <rect x="35" y="10" width="35" height="35" rx="5" fill="#87CEEB" opacity="0.6"/>
    </g>

    <!-- Baby bottle -->
    <g transform="translate(220, 0)">
      <rect x="0" y="20" width="30" height="60" rx="8" fill="#FFFFFF" opacity="0.7"/>
      <rect x="5" y="10" width="20" height="15" rx="5" fill="#FFB6C1" opacity="0.6"/>
      <circle cx="15" cy="50" r="8" fill="#87CEEB" opacity="0.3"/>
    </g>
  </g>

  <!-- Watercolor-style animal illustrations -->
  <!-- Bunny (left side) -->
  <g transform="translate(250, 650)" opacity="0.7">
    <ellipse cx="0" cy="30" rx="50" ry="60" fill="#FFE4E1"/>
    <circle cx="0" cy="-20" r="40" fill="#FFE4E1"/>
    <ellipse cx="-15" cy="-50" rx="12" ry="35" fill="#FFE4E1"/>
    <ellipse cx="15" cy="-50" rx="12" ry="35" fill="#FFE4E1"/>
    <circle cx="-12" cy="-18" r="5" fill="#8B4513"/>
    <circle cx="12" cy="-18" r="5" fill="#8B4513"/>
    <path d="M -8 0 Q 0 5, 8 0" stroke="#FFB6C1" stroke-width="2" fill="none"/>
  </g>

  <!-- Bear (right side) -->
  <g transform="translate(1650, 680)" opacity="0.7">
    <ellipse cx="0" cy="20" rx="55" ry="65" fill="#D2B48C"/>
    <circle cx="0" cy="-25" r="45" fill="#D2B48C"/>
    <circle cx="-30" cy="-40" r="18" fill="#D2B48C"/>
    <circle cx="30" cy="-40" r="18" fill="#D2B48C"/>
    <circle cx="-15" cy="-20" r="6" fill="#8B4513"/>
    <circle cx="15" cy="-20" r="6" fill="#8B4513"/>
    <ellipse cx="0" cy="-5" rx="12" ry="10" fill="#FFE4E1" opacity="0.8"/>
  </g>

  <!-- Floating bubbles -->
  <g filter="url(#soft-glow)">
    <circle cx="450" cy="350" r="20" fill="white" opacity="0.5" stroke="#87CEEB" stroke-width="2">
      <animate attributeName="cy" values="350;300;350" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1450" cy="400" r="15" fill="white" opacity="0.4" stroke="#FFB6C1" stroke-width="2">
      <animate attributeName="cy" values="400;360;400" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="250" r="25" fill="white" opacity="0.5" stroke="#87CEEB" stroke-width="2">
      <animate attributeName="cy" values="250;200;250" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1250" cy="300" r="18" fill="white" opacity="0.45" stroke="#FFB6C1" stroke-width="2">
      <animate attributeName="cy" values="300;260;300" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating stars -->
  <g fill="#FFD700" opacity="0.6">
    <path d="M 550 450 L 555 465 L 570 467 L 558 478 L 561 493 L 550 485 L 539 493 L 542 478 L 530 467 L 545 465 Z">
      <animateTransform attributeName="transform" type="rotate" from="0 550 470" to="360 550 470" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 1350 500 L 354 513 L 367 515 L 357 524 L 360 537 L 350 530 L 340 537 L 343 524 L 333 515 L 346 513 Z">
      <animateTransform attributeName="transform" type="rotate" from="0 1350 518" to="360 1350 518" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Brand message -->
  <text x="960" y="950" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFB6C1" text-anchor="middle" opacity="0.9">宝宝专属守护</text>
  <text x="960" y="995" font-family="Arial, sans-serif" font-size="24" fill="#87CEEB" text-anchor="middle" opacity="0.8">0添加 · 温柔呵护</text>
</svg>
