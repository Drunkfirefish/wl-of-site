<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional studio background -->
  <defs>
    <linearGradient id="studio-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5A6B7D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A4556;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="spotlight-center" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4A5568;stop-opacity:0" />
    </radialGradient>

    <filter id="fabric-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>

    <filter id="professional-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Neutral studio background -->
  <rect width="1920" height="1080" fill="url(#studio-gradient)"/>
  <rect width="1920" height="1080" fill="url(#spotlight-center)"/>

  <!-- Studio lighting setup visualization -->
  <ellipse cx="960" cy="300" rx="600" ry="200" fill="#FFFFFF" opacity="0.08"/>
  <ellipse cx="960" cy="540" rx="700" ry="300" fill="#FFFFFF" opacity="0.05"/>

  <!-- Top-down 45-degree view composition area -->
  <g transform="translate(960, 540) rotate(-15)">
    <!-- Shadow base -->
    <ellipse cx="0" cy="150" rx="400" ry="300" fill="#000000" opacity="0.15"/>

    <!-- Premium fabric samples arranged in composition -->
    <!-- Cashmere swatch (top left) -->
    <g transform="translate(-280, -150)">
      <rect x="0" y="0" width="180" height="140" rx="3" fill="#E6E6FA" opacity="0.85" filter="url(#fabric-texture)"/>
      <rect x="10" y="10" width="160" height="120" rx="2" fill="#D8BFD8" opacity="0.3"/>
      <text x="90" y="75" font-family="Georgia, serif" font-size="14" fill="#4A5568" text-anchor="middle">羊绒</text>
      <text x="90" y="95" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Cashmere</text>
    </g>

    <!-- Silk swatch (top right) -->
    <g transform="translate(100, -160)">
      <rect x="0" y="0" width="190" height="130" rx="3" fill="#FFF8DC" opacity="0.9"/>
      <defs>
        <linearGradient id="silk-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
          <stop offset="50%" style="stop-color:#FFF8DC;stop-opacity:0.1" />
          <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="190" height="130" rx="3" fill="url(#silk-sheen)"/>
      <text x="95" y="70" font-family="Georgia, serif" font-size="14" fill="#4A5568" text-anchor="middle">真丝</text>
      <text x="95" y="90" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Silk</text>
    </g>

    <!-- Down feather sample (bottom left) -->
    <g transform="translate(-250, 50)">
      <rect x="0" y="0" width="160" height="160" rx="3" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="50" cy="60" r="15" fill="#F0F0F0" opacity="0.6"/>
      <circle cx="110" cy="80" r="18" fill="#F5F5F5" opacity="0.7"/>
      <circle cx="80" cy="110" r="20" fill="#FAFAFA" opacity="0.65"/>
      <text x="80" y="145" font-family="Georgia, serif" font-size="14" fill="#4A5568" text-anchor="middle">羽绒</text>
    </g>

    <!-- Product bottle - professional studio lighting -->
    <g transform="translate(40, -20)">
      <!-- Bottle shadow -->
      <ellipse cx="0" cy="180" rx="55" ry="15" fill="#000000" opacity="0.2"/>

      <!-- Main bottle with professional gradient -->
      <defs>
        <linearGradient id="bottle-pro" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#5A6B7D;stop-opacity:0.9" />
          <stop offset="30%" style="stop-color:#6B7C8F;stop-opacity:0.95" />
          <stop offset="70%" style="stop-color:#5A6B7D;stop-opacity:0.9" />
          <stop offset="100%" style="stop-color:#4A5568;stop-opacity:0.85" />
        </linearGradient>
      </defs>

      <rect x="-45" y="20" width="90" height="160" rx="10" fill="url(#bottle-pro)" stroke="#B8860B" stroke-width="1"/>
      <rect x="-35" y="5" width="70" height="20" rx="5" fill="#4A5568"/>

      <!-- Studio lighting highlights -->
      <rect x="30" y="40" width="12" height="120" rx="6" fill="#FFFFFF" opacity="0.25"/>
      <ellipse cx="35" cy="60" rx="8" ry="25" fill="#FFFFFF" opacity="0.35"/>

      <!-- Premium label with technical information -->
      <rect x="-38" y="70" width="76" height="90" rx="4" fill="#FFFFFF" opacity="0.15" stroke="#B8860B" stroke-width="0.5"/>
      <rect x="-35" y="73" width="70" height="1" fill="#B8860B" opacity="0.6"/>

      <text x="0" y="95" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#B8860B" text-anchor="middle">纺优美</text>
      <text x="0" y="112" font-family="Arial, sans-serif" font-size="9" fill="#E6E6FA" text-anchor="middle">Fangyoumei</text>

      <rect x="-30" y="120" width="60" height="1" fill="#B8860B" opacity="0.4"/>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="7" fill="#E6E6FA" text-anchor="middle">专业护理</text>
      <text x="0" y="145" font-family="Arial, sans-serif" font-size="7" fill="#E6E6FA" text-anchor="middle">PROFESSIONAL</text>
      <rect x="-35" y="155" width="70" height="1" fill="#B8860B" opacity="0.6"/>
    </g>

    <!-- Professional tools -->
    <!-- Soft brush -->
    <g transform="translate(-100, 120)">
      <rect x="0" y="0" width="15" height="80" rx="7" fill="#8B7355" opacity="0.7"/>
      <ellipse cx="7.5" cy="80" rx="10" ry="15" fill="#D2B48C" opacity="0.6"/>
    </g>

    <!-- Measuring cup -->
    <g transform="translate(180, 90)">
      <path d="M 0 0 L 10 50 L 50 50 L 60 0 Z" fill="#FFFFFF" opacity="0.3" stroke="#4A5568" stroke-width="1"/>
      <line x1="15" y1="15" x2="45" y2="15" stroke="#4A5568" stroke-width="0.5" opacity="0.4"/>
      <line x1="13" y1="30" x2="47" y2="30" stroke="#4A5568" stroke-width="0.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Fiber microscope detail overlay (semi-transparent) -->
  <g transform="translate(1500, 300)" opacity="0.4">
    <circle cx="0" cy="0" r="120" fill="#4A5568" opacity="0.3" stroke="#B8860B" stroke-width="2"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Fiber strands visualization -->
    <g stroke="#E6E6FA" stroke-width="2" fill="none">
      <path d="M -40 -60 Q -20 -30, -40 0 T -40 60" opacity="0.7"/>
      <path d="M -10 -60 Q 10 -30, -10 0 T -10 60" opacity="0.8"/>
      <path d="M 20 -60 Q 40 -30, 20 0 T 20 60" opacity="0.75"/>
    </g>

    <text x="0" y="145" font-family="Arial, sans-serif" font-size="11" fill="#B8860B" text-anchor="middle">纤维修复技术</text>
  </g>

  <!-- Technical parameter indicators -->
  <g transform="translate(250, 750)" opacity="0.5">
    <rect x="0" y="0" width="300" height="80" rx="5" fill="#4A5568" opacity="0.3" stroke="#B8860B" stroke-width="1"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" fill="#B8860B">pH 值: 6.5-7.0</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B8860B">温度: 30-40°C</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#B8860B">浓度: 1:100</text>
  </g>

  <!-- Professional certification badges -->
  <g transform="translate(1600, 800)">
    <!-- Quality certification -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#B8860B" stroke-width="2" opacity="0.6"/>
    <path d="M 0 -25 L 8 -8 L 25 -5 L 10 8 L 13 25 L 0 16 L -13 25 L -10 8 L -25 -5 L -8 -8 Z" fill="#B8860B" opacity="0.4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#B8860B" text-anchor="middle">A+</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">专业认证</text>
  </g>

  <!-- Brand positioning text -->
  <text x="250" y="250" font-family="Georgia, serif" font-size="52" font-weight="300" fill="#B8860B" opacity="0.85">专家级护理</text>
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="20" fill="#E6E6FA" opacity="0.7">纤维修复技术 · 高端面料专用</text>

  <!-- Technical specifications -->
  <g transform="translate(250, 330)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" opacity="0.6">• 羊绒柔软度提升 40%</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" opacity="0.6">• 真丝光泽修复 95%</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#6B7280" opacity="0.6">• 羽绒蓬松度保持 98%</text>
  </g>
</svg>
