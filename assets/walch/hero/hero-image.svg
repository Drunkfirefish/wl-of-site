<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient - warm and bright -->
  <rect width="1920" height="1080" fill="#FFF8E7"/>

  <!-- Sunlight rays effect -->
  <defs>
    <linearGradient id="sunlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Light rays from top right -->
  <g opacity="0.3">
    <path d="M1920 0 L1200 600 L1920 200 Z" fill="url(#sunlight)"/>
    <path d="M1920 0 L900 700 L1920 300 Z" fill="url(#sunlight)"/>
    <path d="M1920 0 L600 800 L1920 400 Z" fill="url(#sunlight)"/>
  </g>

  <!-- Product bottle silhouette (left 1/3) -->
  <g transform="translate(250, 200)">
    <!-- Main bottle -->
    <ellipse cx="150" cy="600" rx="120" ry="30" fill="#00A651" opacity="0.2"/>
    <rect x="30" y="200" width="240" height="400" rx="20" fill="#00A651" opacity="0.9"/>
    <rect x="80" y="150" width="140" height="60" rx="10" fill="#00A651"/>

    <!-- Highlight on bottle -->
    <ellipse cx="100" cy="300" rx="40" ry="100" fill="white" opacity="0.3"/>

    <!-- Label area -->
    <rect x="60" y="350" width="180" height="120" rx="8" fill="white" opacity="0.8"/>
    <text x="150" y="400" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00A651" text-anchor="middle">威露士</text>
    <text x="150" y="430" font-family="Arial, sans-serif" font-size="16" fill="#00A651" text-anchor="middle">Walch</text>
  </g>

  <!-- Family scene silhouettes (right 2/3, slightly blurred) -->
  <g transform="translate(900, 400)" opacity="0.6" filter="url(#blur)">
    <!-- Mother silhouette -->
    <circle cx="200" cy="100" r="50" fill="#4A5568"/>
    <ellipse cx="200" cy="200" rx="60" ry="80" fill="#4A5568"/>

    <!-- Child silhouette -->
    <circle cx="350" cy="130" r="40" fill="#4A5568"/>
    <ellipse cx="350" cy="210" rx="50" ry="65" fill="#4A5568"/>
  </g>

  <!-- Antibacterial particle effects -->
  <g filter="url(#glow)">
    <circle cx="600" cy="300" r="8" fill="#00A651" opacity="0.6">
      <animate attributeName="cy" values="300;250;300" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="450" r="6" fill="#00A651" opacity="0.5">
      <animate attributeName="cy" values="450;420;450" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="500" r="10" fill="#00A651" opacity="0.7">
      <animate attributeName="cy" values="500;460;500" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="350" r="7" fill="#00A651" opacity="0.6">
      <animate attributeName="cy" values="350;310;350" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Brand text overlay -->
  <text x="960" y="950" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00A651" text-anchor="middle" opacity="0.9">家庭健康守护者</text>
</svg>
